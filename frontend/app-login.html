<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Ecom Inteligente</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #0066ff;
            --primary-hover: #0284c7;
            --bg-dark: #030712;
            --card-bg: rgba(17, 24, 39, 0.7);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border: rgba(255, 255, 255, 0.08);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--bg-dark);
            background-image: 
                radial-gradient(circle at 0% 0%, rgba(14, 165, 233, 0.1) 0%, transparent 40%),
                radial-gradient(circle at 100% 100%, rgba(14, 165, 233, 0.05) 0%, transparent 40%);
            color: var(--text-main);
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .login-card {
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            padding: 3rem;
            border-radius: 28px;
            border: 1px solid var(--border);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            width: 100%;
            max-width: 420px;
            text-align: center;
            animation: slideUp 0.8s ease-out;
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .brand { font-size: 28px; font-weight: 800; margin-bottom: 8px; letter-spacing: -1px; }
        .brand span { color: var(--primary); }

        p.subtitle { color: var(--text-muted); font-size: 14px; margin-bottom: 35px; font-weight: 500; }

        .input-group { position: relative; margin-bottom: 20px; text-align: left; }
        .input-group i {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
            font-size: 16px;
        }

        input {
            width: 100%;
            padding: 14px 16px 14px 48px;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid var(--border);
            border-radius: 14px;
            color: white;
            font-size: 15px;
            transition: all 0.3s ease;
            outline: none;
        }

        input:focus {
            border-color: var(--primary);
            background: rgba(0, 0, 0, 0.5);
            box-shadow: 0 0 0 4px rgba(14, 165, 233, 0.1);
        }

        button {
            width: 100%;
            padding: 16px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 14px;
            font-size: 15px;
            font-weight: 800;
            cursor: pointer;
            margin-top: 10px;
            transition: all 0.3s;
            box-shadow: 0 10px 15px -3px rgba(14, 165, 233, 0.3);
        }

        button:hover {
            background: var(--primary-hover);
            transform: translateY(-2px);
            box-shadow: 0 20px 25px -5px rgba(14, 165, 233, 0.4);
        }

        button:active { transform: translateY(0); }

        #mensagem { 
            margin-top: 20px;
            color: #ef4444; 
            font-size: 13px; 
            font-weight: 600; 
            min-height: 20px;
        }

        .links-footer { margin-top: 30px; font-size: 13px; }
        .links-footer a { color: var(--primary); text-decoration: none; font-weight: 600; }
        .links-footer a:hover { text-decoration: underline; }

        footer {
            position: absolute;
            bottom: 30px;
            color: var(--text-muted);
            font-size: 12px;
            text-align: center;
        }
    </style>
</head>
<body>

<div class="login-card">
    <div class="brand">Ecom <span>Inteligente</span></div>
    <p class="subtitle">Bem-vindo à sua Central de Performance</p>
    
    <div class="input-group">
        <i class="fa-solid fa-envelope"></i>
        <input type="email" id="email" placeholder="E-mail de acesso">
    </div>

    <div class="input-group">
        <i class="fa-solid fa-lock"></i>
        <input type="password" id="password" placeholder="Sua senha">
    </div>

    <button onclick="fazerLogin()">Acessar Dashboard <i class="fa-solid fa-arrow-right" style="margin-left: 8px;"></i></button>
    
    <p id="mensagem"></p>

    <div class="links-footer">
        <span style="color: var(--text-muted);">Não tem conta?</span> 
        <a href="app-demo-live.html">Conhecer Planos</a>
    </div>
</div>

<footer>
    &copy; 2026 Ecom Inteligente - Tecnologia e Gestão de Performance
</footer>

<script src="https://js.stripe.com/v3/"></script>

<script>
    async function fazerLogin() {
        const email = document.getElementById('email').value;
        const password = document.getElementById('password').value;
        const mensagem = document.getElementById('mensagem');

        mensagem.textContent = "Autenticando...";

        if (!email || !password) {
            mensagem.textContent = "Preencha todos os campos!";
            return;
        }

        try {
            // 1. Faz o pedido de Login para o seu domínio oficial
            const response = await fetch('https://ecominteligente.com.br/api/login', { 
                method: 'POST',
                headers: { 
                    'Content-Type': 'application/json',
                    'Accept': 'application/json'
                },
                body: JSON.stringify({ email, senha: password }) 
            });

            const data = await response.json();

            if (response.ok) {
                console.log("✅ Login realizado com sucesso!");
                const user = data.user;
                
                // Salva os dados no navegador
                localStorage.setItem('token', data.token);
                localStorage.setItem('userId', String(user.id));
                localStorage.setItem('usuarioNome', user.name);

                // 2. Checa se o Trial (7 dias) ou Assinatura estão ativos
                const hoje = new Date();
                const dataFimTrial = new Date(user.trial_ends);
                const trialAtivo = dataFimTrial > hoje;

                if (user.assinado === true || trialAtivo === true) {
                    console.log("🔓 Acesso liberado. Verificando sites do usuário...");

                    try {
                        // 3. Busca sites do usuário usando a rota correta do MySQL e enviando o Token de segurança
                        const resSites = await fetch(`https://ecominteligente.com.br/api/sites/user/${user.id}`, {
                            headers: { 'Authorization': `Bearer ${data.token}` }
                        });
                        const sites = await resSites.json();

                        if (sites && sites.length > 0) {
                            // ✅ JÁ TEM SITE: Vai para a lista (Meus Sites)
                            console.log("📂 Redirecionando para Meus Sites.");
                            window.location.href = './app-meus-sites.html';
                        } else {
                            // 🆕 CONTA NOVA: Vai cadastrar o primeiro
                            console.log("✨ Redirecionando para Configurar Site.");
                            window.location.href = './app-configurar-site.html';
                        }
                    } catch (err) {
                        console.warn("⚠️ Erro ao buscar sites, usando fallback.");
                        window.location.href = './app-meus-sites.html';
                    }

                } else {
                    // ❌ TESTE EXPIROU
                    console.log("⏳ Período de teste expirado.");
                    iniciarCheckout(user.id);
                }
            } else {
                mensagem.textContent = data.error || "E-mail ou senha incorretos.";
            }

        } catch (error) {
            console.error("❌ Erro de conexão:", error);
            mensagem.textContent = "Erro ao conectar com o servidor.";
        }
    }

    async function iniciarCheckout(userId) {
        const mensagem = document.getElementById('mensagem');
        try {
            mensagem.textContent = "Preparando checkout...";
            const priceId = localStorage.getItem('priceId') || 'price_1TGR7URplau9uu4H5ng69HM8';
            
            // Ajustado para o endpoint correto de produção
            const response = await fetch('https://ecominteligente.com.br/api/create-checkout-session', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ userId, priceId })
            });
            
            const checkoutData = await response.json();
            
            if (!response.ok) throw new Error(checkoutData.error);

            const stripe = Stripe('pk_test_51TFmjNRplau9uu4H841khCOGHJoig4TicabtbhyS6jN4VRkf7eejl5ZQwoTIsOMNO1SSxgCQjBPqxK7mV8edlOQH00o558JFRU');
            await stripe.redirectToCheckout({ sessionId: checkoutData.id });
            
        } catch (err) {
            console.error("Erro no Stripe:", err);
            mensagem.textContent = "Seu teste expirou. Erro ao abrir pagamento.";
        }
    }

    // Atalho para o Enter no campo de senha
    document.getElementById('password').addEventListener('keypress', (e) => {
        if (e.key === 'Enter') fazerLogin();
    });
</script>


</body>
</html>
