<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Assinatura Ativa | Ecom Inteligente</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #0066ff;
            --success: #10b981;
            --bg-dark: #030712;
            --card-bg: rgba(17, 24, 39, 0.7);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border: rgba(255, 255, 255, 0.08);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--bg-dark);
            background-image: 
                radial-gradient(circle at 50% 0%, rgba(16, 185, 129, 0.15) 0%, transparent 50%);
            color: var(--text-main);
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
            overflow: hidden;
        }

        .success-card {
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            padding: 3rem;
            border-radius: 32px;
            border: 1px solid var(--border);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            width: 100%;
            max-width: 480px;
            text-align: center;
            animation: popIn 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            position: relative;
        }

        @keyframes popIn {
            from { opacity: 0; transform: scale(0.8); }
            to { opacity: 1; transform: scale(1); }
        }

        .icon-box {
            width: 80px;
            height: 80px;
            background: rgba(16, 185, 129, 0.1);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 25px;
            position: relative;
        }

        .icon-box i {
            font-size: 40px;
            color: var(--success);
            z-index: 2;
        }

        .icon-box::after {
            content: '';
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background: var(--success);
            opacity: 0.2;
            animation: pulseSuccess 2s infinite;
        }

        @keyframes pulseSuccess {
            0% { transform: scale(1); opacity: 0.2; }
            100% { transform: scale(1.8); opacity: 0; }
        }

        .brand { font-size: 20px; font-weight: 800; margin-bottom: 30px; letter-spacing: -0.5px; opacity: 0.8; }
        .brand span { color: var(--primary); }

        h1 { font-size: 32px; font-weight: 800; margin-bottom: 15px; letter-spacing: -1px; }
        p { color: var(--text-muted); line-height: 1.6; font-size: 16px; margin-bottom: 35px; }
        p strong { color: var(--text-main); }

        .btn-dashboard {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            padding: 18px 35px;
            background: var(--primary);
            color: white;
            text-decoration: none;
            border-radius: 16px;
            font-weight: 800;
            font-size: 15px;
            transition: all 0.3s;
            box-shadow: 0 10px 20px -5px rgba(14, 165, 233, 0.4);
        }

        .btn-dashboard:hover {
            background: #0284c7;
            transform: translateY(-3px);
            box-shadow: 0 20px 30px -10px rgba(14, 165, 233, 0.5);
        }

        /* EFEITO DE BRILHO AO FUNDO */
        .glow {
            position: absolute;
            width: 100px;
            height: 100px;
            background: var(--primary);
            filter: blur(80px);
            z-index: -1;
            opacity: 0.3;
        }

        footer {
            position: absolute;
            bottom: 30px;
            color: var(--text-muted);
            font-size: 12px;
            text-align: center;
        }
    </style>
</head>
<body>

    <div class="glow" style="top: 20%; left: 20%;"></div>
    <div class="glow" style="bottom: 20%; right: 20%;"></div>

    <div class="success-card">
        <div class="brand">Ecom <span>Inteligente</span></div>
        
        <div class="icon-box">
            <i class="fa-solid fa-circle-check"></i>
        </div>

        <h1>Assinatura Ativa!</h1>
        <p>Parabéns, <strong>Paulo</strong>! Seu acesso ao ecossistema foi liberado. Prepare-se para gerir seu negócio com a precisão dos dados.</p>
        
        <a href="app-dashboard.html" class="btn-dashboard">
            Acessar meu Dashboard <i class="fa-solid fa-arrow-right"></i>
        </a>
    </div>

    <footer>
        &copy; 2026 Ecom Inteligente - Tecnologia e Gestão de Performance
    </footer>

</body>
</html>
